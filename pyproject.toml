[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groww_agent"
version = "0.1.0"
description = "Groww Weekly User Feedback Intelligence AI Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "google-play-scraper>=1.2",
    "google-generativeai>=0.5",
    "structlog>=23.0",
    "rapidfuzz>=3.0",
    "click>=8.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
groww-agent = "src.__main__:main"
